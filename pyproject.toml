[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "valueproof"
version = "0.4.0"
description = "Prove an AI cost cut on your own traffic before you ship it: cheap and strong models working together (Scout & Rescue), measured by cost per outcome with a blind quality review."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE-CODE"]
keywords = ["llm", "llm cost", "cost per outcome", "model cascade", "evaluation", "finops", "llmops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []  # the core has none; any provider works

[project.optional-dependencies]
claude = ["anthropic>=2.14"]
openai = ["openai>=3.60"]
gemini = ["google-genai>=3.6; python_version >= '3.11'"]  # the Gemini SDK needs Python 3.11+
all = ["anthropic>=2.14", "openai>=3.60", "google-genai>=3.6; python_version >= '3.11'"]
dev = ["pytest>=8"]

[project.scripts]
valueproof = "valueproof.cli:main"
mmco = "valueproof.cli:main_mmco"  # old name, removed in 1.0

[project.urls]
Homepage = "https://github.com/AndyJakob78/valueproof"
"Old package name" = "https://pypi.org/project/ai-mixed-model-cost-optimization/"

[tool.setuptools.packages.find]
where = ["src"]
