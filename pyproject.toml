[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-mixed-model-cost-optimization"
version = "0.1.0"
description = "Let cheap and strong AI models work together (Scout & Rescue), and test each cost change against your current setup with a blind quality review."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE-CODE"]
keywords = ["llm", "cost", "model cascade", "evaluation", "finops", "llmops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []  # the core has none; any provider works

[project.optional-dependencies]
claude = ["anthropic>=2.14"]

[project.scripts]
mmco = "mixed_model_cost.cli:main"

[project.urls]
Homepage = "https://github.com/AndyJakob78/ai-mixed-model-cost-optimization"

[tool.setuptools.packages.find]
where = ["src"]
